name: Remote SSH Deploy

on:
  push:
    branches:
      - master

# Deploys queue, they do not cancel. update.sh puts the site into maintenance mode
# before it arms the trap that brings it back up, and runs migrations part way
# through, so killing one can leave the site down or a migration half applied.
# Serialising still stops two deploys writing the same directory at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy from the canonical repo — not forks (e.g. after syncing master).
    if: github.repository == 'jgrossi/elephpant.me'
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          request_pty: true
          script: |
            bash -l -c "cd /var/www/vhosts/elephpant.me/httpdocs && ./update.sh"
